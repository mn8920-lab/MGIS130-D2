<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Weather Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="app-body" class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans transition-colors duration-700">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Search Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-800/80 backdrop-blur-md p-4 rounded-2xl border border-slate-700/60 shadow-lg gap-4">
      <div class="flex items-center gap-2">
        <span id="header-icon" class="text-2xl">☀️</span>
        <h1 class="text-xl font-bold tracking-wide text-cyan-400">Weather Pulse</h1>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <input id="location-input" type="text" value="Canandaigua" placeholder="Enter City Name or Lat, Lon" class="px-4 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-500 w-full sm:w-64">
        <button onclick="handleSearch()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm px-5 py-2 rounded-xl transition font-medium shadow-md">Search</button>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="error-box" class="hidden bg-rose-900/60 border border-rose-500 text-rose-200 p-3 rounded-xl text-sm backdrop-blur-md"></div>

    <!-- Main Dynamic Hero Card -->
    <div id="hero-card" class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/60 rounded-2xl p-6 shadow-xl relative overflow-hidden transition-all duration-700">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative z-10">
        <div>
          <div class="flex items-center gap-2">
            <span id="weather-icon" class="text-4xl">☀️</span>
            <span id="condition-label" class="text-lg font-medium text-slate-300">Clear Sky</span>
          </div>
          <h2 id="location-label" class="text-slate-400 text-sm mt-2 font-medium">--</h2>
          <p id="temp" class="text-6xl sm:text-7xl font-black my-2 tracking-tight">--°F</p>
          <p id="feels-like" class="text-slate-300 text-sm">Feels like --°F</p>
        </div>
        
        <div class="grid grid-cols-2 gap-4 w-full sm:w-auto bg-slate-900/40 p-4 rounded-xl border border-slate-700/40 text-sm backdrop-blur-sm">
          <div>
            <p class="text-slate-400 text-xs">Humidity</p>
            <p id="humidity" class="text-lg font-bold">--%</p>
          </div>
          <div>
            <p class="text-slate-400 text-xs">Wind Speed</p>
            <p id="wind" class="text-lg font-bold">-- mph</p>
          </div>
          <div>
            <p class="text-slate-400 text-xs">High</p>
            <p id="temp-max" class="text-lg font-bold text-amber-400">--°F</p>
          </div>
          <div>
            <p class="text-slate-400 text-xs">Low</p>
            <p id="temp-min" class="text-lg font-bold text-cyan-400">--°F</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Apple Weather Style Hourly Forecast (Line Chart + Synchronized Icons at Bottom) -->
    <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-5 shadow-lg">
      <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
        <span>⏰</span> Hourly Forecast
      </h3>
      
      <!-- Horizontal Scrollable Container -->
      <div class="overflow-x-auto no-scrollbar py-2">
        <div class="min-w-[900px]">
          <!-- Line Chart Layer -->
          <div class="h-36 relative">
            <canvas id="hourlyChart"></canvas>
          </div>
          
          <!-- Bottom Weather Icon Track (Aligned to Chart Points) -->
          <div id="icon-track" class="flex justify-between pt-2 border-t border-slate-700/50 text-center">
            <!-- Icons injected dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- 7-Day Extended Forecast Slider Carousel -->
    <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-5 shadow-lg">
      <h3 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
        <span>📅</span> 7-Day Extended Forecast
      </h3>
      <div id="daily-slider" class="flex gap-4 overflow-x-auto no-scrollbar py-2 px-1">
        <!-- Daily forecast cards generated dynamically -->
      </div>
    </div>

  </div>

  <script>
    let chartInstance = null;

    function parseWeatherCode(code, isDay = 1) {
      if (code === 0) {
        return isDay 
          ? { icon: '☀️', text: 'Clear Sky', bg: 'from-amber-600/30 to-blue-900/60', card: 'border-amber-500/40' }
          : { icon: '🌙', text: 'Clear Night', bg: 'from-indigo-950 to-slate-900', card: 'border-indigo-500/40' };
      }
      if ([1, 2, 3].includes(code)) {
        return { icon: isDay ? '⛅' : '☁️', text: 'Partly Cloudy', bg: 'from-slate-700/50 to-slate-900', card: 'border-slate-600/40' };
      }
      if ([45, 48].includes(code)) {
        return { icon: '🌫️', text: 'Foggy', bg: 'from-gray-700/50 to-slate-900', card: 'border-gray-500/40' };
      }
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) {
        return { icon: '🌧️', text: 'Rainy', bg: 'from-cyan-900/40 to-slate-900', card: 'border-cyan-500/40' };
      }
      if ([71, 73, 75, 77, 85, 86].includes(code)) {
        return { icon: '❄️', text: 'Snowy', bg: 'from-blue-900/30 to-slate-900', card: 'border-blue-300/40' };
      }
      if ([95, 96, 99].includes(code)) {
        return { icon: '⛈️', text: 'Thunderstorm', bg: 'from-purple-900/40 to-slate-950', card: 'border-purple-500/40' };
      }
      return { icon: '☁️', text: 'Overcast', bg: 'from-slate-800 to-slate-900', card: 'border-slate-700' };
    }

    function showError(msg) {
      const errBox = document.getElementById('error-box');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    function clearError() {
      const errBox = document.getElementById('error-box');
      errBox.innerText = '';
      errBox.classList.add('hidden');
    }

    async function getCoordinates(query) {
      const parts = query.split(',').map(s => s.trim());
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return { lat: parts[0], lon: parts[1], name: `Lat: ${parts[0]}, Lon: ${parts[1]}` };
      }

      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
      const res = await fetch(geoUrl);
      const data = await res.json();

      if (!data.results || data.results.length === 0) {
        throw new Error(`Location "${query}" not found.`);
      }

      const loc = data.results[0];
      return { lat: loc.latitude, lon: loc.longitude, name: `${loc.name}, ${loc.admin1 || loc.country}` };
    }

    async function handleSearch() {
      clearError();
      const input = document.getElementById('location-input').value;
      if (!input) return;

      try {
        const { lat, lon, name } = await getCoordinates(input);
        document.getElementById('location-label').innerText = name;
        await fetchWeather(lat, lon);
      } catch (err) {
        showError(err.message);
      }
    }

    async function fetchWeather(lat, lon) {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;

      try {
        const response = await fetch(weatherUrl);
        if (!response.ok) throw new Error('Failed to fetch weather data from API.');
        const data = await response.json();

        // 1. Update Hero Card Data
        const condition = parseWeatherCode(data.current.weather_code, data.current.is_day);
        document.getElementById('weather-icon').innerText = condition.icon;
        document.getElementById('header-icon').innerText = condition.icon;
        document.getElementById('condition-label').innerText = condition.text;
        document.getElementById('temp').innerText = `${Math.round(data.current.temperature_2m)}°F`;
        document.getElementById('feels-like').innerText = `Feels like ${Math.round(data.current.apparent_temperature)}°F`;
        document.getElementById('humidity').innerText = `${data.current.relative_humidity_2m}%`;
        document.getElementById('wind').innerText = `${data.current.wind_speed_10m} mph`;
        document.getElementById('temp-max').innerText = `${Math.round(data.daily.temperature_2m_max[0])}°F`;
        document.getElementById('temp-min').innerText = `${Math.round(data.daily.temperature_2m_min[0])}°F`;

        const heroCard = document.getElementById('hero-card');
        heroCard.className = `bg-gradient-to-br ${condition.bg} border ${condition.card} rounded-2xl p-6 shadow-xl relative overflow-hidden transition-all duration-700`;

        // 2. Render Hourly Chart + Bottom Icon Track
        const currentHour = new Date().getHours();
        const chartLabels = data.hourly.time.slice(currentHour, currentHour + 24).map((t, idx) => {
          if (idx === 0) return 'Now';
          const hourNum = parseInt(t.split('T')[1].split(':')[0]);
          const ampm = hourNum >= 12 ? 'PM' : 'AM';
          const formattedHour = hourNum % 12 === 0 ? 12 : hourNum % 12;
          return `${formattedHour}${ampm}`;
        });

        const chartTemps = data.hourly.temperature_2m.slice(currentHour, currentHour + 24).map(t => Math.round(t));
        const iconTrackContainer = document.getElementById('icon-track');
        iconTrackContainer.innerHTML = '';

        for (let i = currentHour; i < currentHour + 24; i++) {
          const codeVal = data.hourly.weather_code[i];
          const hourNum = i % 24;
          const hourCond = parseWeatherCode(codeVal, (hourNum >= 6 && hourNum <= 20) ? 1 : 0);

          iconTrackContainer.innerHTML += `
            <div class="flex-1 text-center">
              <span class="text-lg block">${hourCond.icon}</span>
            </div>
          `;
        }

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('hourlyChart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: chartLabels,
            datasets: [{
              data: chartTemps,
              borderColor: '#22d3ee',
              backgroundColor: 'rgba(34, 211, 238, 0.15)',
              fill: true,
              tension: 0.35,
              pointRadius: 3,
              pointBackgroundColor: '#22d3ee'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
              y: { display: false }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (context) => `${context.parsed.y}°F`
                }
              }
            }
          }
        });

        // 3. Render 7-Day Extended Forecast Slider
        const dailyContainer = document.getElementById('daily-slider');
        dailyContainer.innerHTML = '';

        for (let d = 0; d < 7; d++) {
          const dateStr = new Date(data.daily.time[d] + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          const maxT = Math.round(data.daily.temperature_2m_max[d]);
          const minT = Math.round(data.daily.temperature_2m_min[d]);
          const dayCond = parseWeatherCode(data.daily.weather_code[d]);

          dailyContainer.innerHTML += `
            <div class="flex-none bg-slate-900/60 border border-slate-700/50 rounded-xl p-4 min-w-[120px] text-center backdrop-blur-sm hover:border-cyan-500/50 transition">
              <p class="text-xs font-semibold text-slate-300 mb-1">${d === 0 ? 'Today' : dateStr}</p>
              <p class="text-3xl my-2">${dayCond.icon}</p>
              <p class="text-xs text-slate-400 font-medium mb-2">${dayCond.text}</p>
              <div class="flex justify-center gap-2 text-xs font-bold border-t border-slate-700/60 pt-2">
                <span class="text-amber-400">${maxT}°</span>
                <span class="text-cyan-400">${minT}°</span>
              </div>
            </div>
          `;
        }

      } catch (err) {
        showError(err.message);
      }
    }

    handleSearch();
  </script>
</body>
</html>
