<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Weather Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header Controls -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700 gap-4">
      <h1 class="text-xl font-bold tracking-wide text-cyan-400">Weather Pulse</h1>
      <div class="flex gap-2 w-full sm:w-auto">
        <input id="location-input" type="text" value="Canandaigua" placeholder="City or Lat, Lon" class="px-3 py-1 bg-slate-900 border border-slate-700 rounded text-sm text-slate-100 focus:outline-none focus:border-cyan-500 w-full sm:w-64">
        <button onclick="handleSearch()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-sm px-4 py-1 rounded transition font-medium">Search</button>
      </div>
    </header>

    <!-- Error Alert Box -->
    <div id="error-box" class="hidden bg-rose-900/50 border border-rose-500 text-rose-200 p-3 rounded-lg text-sm"></div>

    <!-- Weather Data Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Current Condition Card -->
      <div class="md:col-span-1 bg-slate-800 border border-slate-700 rounded-xl p-6 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-cyan-900 text-cyan-300">Live API</span>
            <span id="location-label" class="text-xs text-slate-400 font-medium">--</span>
          </div>
          <h2 class="text-slate-400 text-sm mt-3">Current Temperature</h2>
          <p id="temp" class="text-6xl font-extrabold my-2">--°F</p>
          <p id="feels-like" class="text-slate-400 text-sm">Feels like --°F</p>
        </div>
        <div class="border-t border-slate-700 pt-4 mt-4 grid grid-cols-2 gap-2 text-sm">
          <div>
            <p class="text-slate-400">Humidity</p>
            <p id="humidity" class="font-bold">--%</p>
          </div>
          <div>
            <p class="text-slate-400">Wind Speed</p>
            <p id="wind" class="font-bold">-- mph</p>
          </div>
        </div>
      </div>

      <!-- 24-Hour Forecast Chart -->
      <div class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-6">
        <h3 class="text-sm font-semibold text-slate-300 mb-4">24-Hour Temperature Forecast</h3>
        <canvas id="hourlyChart" class="w-full h-48"></canvas>
      </div>
    </div>

  </div>

  <script>
    let chartInstance = null;

    function showError(msg) {
      const errBox = document.getElementById('error-box');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    function clearError() {
      const errBox = document.getElementById('error-box');
      errBox.innerText = '';
      errBox.classList.add('hidden');
    }

    async function getCoordinates(query) {
      // Check if input is already lat, lon numbers
      const parts = query.split(',').map(s => s.trim());
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return { lat: parts[0], lon: parts[1], name: `${parts[0]}, ${parts[1]}` };
      }

      // Geocode City Name via Open-Meteo Geocoding API
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
      const res = await fetch(geoUrl);
      const data = await res.json();

      if (!data.results || data.results.length === 0) {
        throw new Error(`Location "${query}" not found. Try entering a valid city or coordinates.`);
      }

      const loc = data.results[0];
      return { lat: loc.latitude, lon: loc.longitude, name: `${loc.name}, ${loc.admin1 || loc.country}` };
    }

    async function handleSearch() {
      clearError();
      const input = document.getElementById('location-input').value;
      if (!input) return;

      try {
        const { lat, lon, name } = await getCoordinates(input);
        document.getElementById('location-label').innerText = name;
        await fetchWeather(lat, lon);
      } catch (err) {
        showError(err.message);
      }
    }

    async function fetchWeather(lat, lon) {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&hourly=temperature_2m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;

      try {
        const response = await fetch(weatherUrl);
        if (!response.ok) throw new Error('Failed to retrieve weather data from provider.');
        const data = await response.json();

        // Update Text Elements
        document.getElementById('temp').innerText = `${Math.round(data.current.temperature_2m)}°F`;
        document.getElementById('feels-like').innerText = `Feels like ${Math.round(data.current.apparent_temperature)}°F`;
        document.getElementById('humidity').innerText = `${data.current.relative_humidity_2m}%`;
        document.getElementById('wind').innerText = `${data.current.wind_speed_10m} mph`;

        // Parse Forecast Chart
        const hourlyTimes = data.hourly.time.slice(0, 24).map(t => t.split('T')[1]);
        const hourlyTemps = data.hourly.temperature_2m.slice(0, 24);

        if (chartInstance) chartInstance.destroy();

        const ctx = document.getElementById('hourlyChart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: hourlyTimes,
            datasets: [{
              label: 'Temp (°F)',
              data: hourlyTemps,
              borderColor: '#22d3ee',
              backgroundColor: 'rgba(34, 211, 238, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
              y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
            },
            plugins: { legend: { display: false } }
          }
        });

      } catch (err) {
        showError(err.message);
      }
    }

    // Initial load on startup
    handleSearch();
  </script>
</body>
</html>
